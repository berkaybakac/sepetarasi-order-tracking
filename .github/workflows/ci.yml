name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    env:
      # This job does not launch or package the Electron app; skip the large
      # binary download so transient network failures do not break npm ci.
      ELECTRON_SKIP_BINARY_DOWNLOAD: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build -w packages/shared
      - run: npm run build -w packages/web
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:coverage
