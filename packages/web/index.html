<!DOCTYPE html>
<html lang="tr" data-app-shell="booting">
  <head>
    <script>
      (function () {
        try {
          var path = window.location && window.location.pathname ? window.location.pathname : "";
          var isDisplayPath =
            path === "/display" || path === "/display/" || path === "/display.html";
          if (!isDisplayPath) return;

          var root = document.documentElement;
          if (root) {
            root.setAttribute("data-display-shell", "instant");
            root.setAttribute("data-app-shell", "ready");
          }

          if (window.__displayDiagnosticsInstalled) return;
          window.__displayDiagnosticsInstalled = true;

          function safeToString(value) {
            if (value === null || value === undefined) return String(value);
            if (typeof value === "string") return value;
            if (typeof value === "number" || typeof value === "boolean") return String(value);
            if (typeof value.message === "string" && value.message) return value.message;
            try {
              return JSON.stringify(value);
            } catch (_error) {
              return Object.prototype.toString.call(value);
            }
          }

          function ensureOverlay() {
            var overlay = document.getElementById("__display-error-overlay");
            if (overlay) return overlay;

            overlay = document.createElement("div");
            overlay.id = "__display-error-overlay";
            overlay.setAttribute(
              "style",
              "position:fixed;inset:0;z-index:2147483647;overflow:auto;background:#2d0202;color:#fff;padding:24px 20px 32px;font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;",
            );

            var title = document.createElement("div");
            title.textContent = "DISPLAY HATASI";
            title.setAttribute(
              "style",
              "font-size:clamp(32px,7vw,64px);font-weight:900;letter-spacing:0.04em;line-height:1.05;",
            );
            overlay.appendChild(title);

            var subtitle = document.createElement("div");
            subtitle.textContent = "Path: " + path;
            subtitle.setAttribute(
              "style",
              "margin-top:12px;font-size:clamp(16px,3vw,24px);font-weight:700;color:#fecaca;",
            );
            overlay.appendChild(subtitle);

            var log = document.createElement("div");
            log.id = "__display-error-log";
            log.setAttribute("style", "display:flex;flex-direction:column;gap:14px;margin-top:20px;");
            overlay.appendChild(log);

            (document.body || document.documentElement).appendChild(overlay);
            return overlay;
          }

          function appendField(parent, label, value) {
            if (!value || value === "0:0" || value === "0") return;
            var line = document.createElement("div");
            line.textContent = label + ": " + value;
            line.setAttribute(
              "style",
              "margin-top:8px;font-size:clamp(16px,2.4vw,24px);line-height:1.4;",
            );
            parent.appendChild(line);
          }

          function report(kind, payload) {
            var overlay = ensureOverlay();
            var log = document.getElementById("__display-error-log");
            if (!log) {
              log = overlay;
            }

            var entry = document.createElement("div");
            entry.setAttribute(
              "style",
              "border:3px solid rgba(254,202,202,0.45);background:rgba(17,24,39,0.5);padding:16px 18px;",
            );

            var heading = document.createElement("div");
            heading.textContent = kind;
            heading.setAttribute(
              "style",
              "font-size:clamp(18px,3vw,28px);font-weight:900;color:#fecaca;letter-spacing:0.03em;",
            );
            entry.appendChild(heading);

            appendField(entry, "Mesaj", safeToString(payload.message));
            appendField(entry, "Kaynak", safeToString(payload.source));
            appendField(entry, "Konum", safeToString(payload.location));

            log.appendChild(entry);
          }

          var previousOnError = window.onerror;
          window.onerror = function (message, source, lineno, colno, error) {
            report("JS ERROR", {
              message: error && error.stack ? error.stack : message,
              source: source,
              location: String(lineno || 0) + ":" + String(colno || 0),
            });
            if (typeof previousOnError === "function") {
              return previousOnError.apply(this, arguments);
            }
            return false;
          };

          var previousOnUnhandledRejection = window.onunhandledrejection;
          window.onunhandledrejection = function (event) {
            var reason = event && "reason" in event ? event.reason : undefined;
            report("PROMISE REJECTION", {
              message: reason && reason.stack ? reason.stack : safeToString(reason),
              source: "",
              location: "",
            });
            if (typeof previousOnUnhandledRejection === "function") {
              return previousOnUnhandledRejection.apply(this, arguments);
            }
            return false;
          };

          window.addEventListener(
            "error",
            function (event) {
              var target = event.target || event.srcElement;
              if (!target || target === window) return;

              var tagName = target.tagName ? String(target.tagName).toUpperCase() : "RESOURCE";
              var source =
                target.src ||
                target.href ||
                (typeof target.getAttribute === "function"
                  ? target.getAttribute("src") || target.getAttribute("href")
                  : "");

              report("RESOURCE LOAD ERROR", {
                message: tagName + " yuklenemedi",
                source: source || safeToString(target.outerHTML || tagName),
                location: "",
              });
            },
            true,
          );
        } catch (_error) {}
      })();
    </script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon.png?v=20260416" />
    <link rel="shortcut icon" href="/favicon.png?v=20260416" />
    <title>Sepetarasi</title>
    <style>
      html,
      body {
        margin: 0;
        min-height: 100%;
        background: #08111f;
      }

      body {
        color: #f8fafc;
        font-family:
          Inter,
          ui-sans-serif,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
      }

      #root {
        min-height: 100vh;
        opacity: 0;
        filter: blur(14px);
        transform: translateY(18px) scale(0.985);
        transition:
          opacity 360ms cubic-bezier(0.22, 1, 0.36, 1),
          filter 420ms ease,
          transform 420ms cubic-bezier(0.22, 1, 0.36, 1);
        will-change: opacity, filter, transform;
      }

      html[data-app-shell="ready"] #root {
        opacity: 1;
        filter: none;
        transform: none;
      }

      html[data-display-shell="instant"] #root {
        opacity: 1;
        filter: none;
        transform: none;
        transition: none;
      }

      #app-boot {
        position: fixed;
        inset: 0;
        z-index: 9999;
        transition:
          opacity 360ms ease,
          visibility 360ms ease,
          transform 420ms cubic-bezier(0.22, 1, 0.36, 1);
      }

      #app-boot[data-state="leaving"] {
        opacity: 0;
        visibility: hidden;
        transform: scale(1.015);
        pointer-events: none;
      }

      #app-boot[data-state="hidden"] {
        display: none;
      }

      html[data-display-shell="instant"] #app-boot {
        display: none !important;
      }

      .boot-shell {
        position: relative;
        display: flex;
        min-height: 100dvh;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        background:
          radial-gradient(circle at 14% 14%, rgba(125, 211, 252, 0.08), transparent 30%),
          radial-gradient(circle at 82% 18%, rgba(34, 211, 238, 0.06), transparent 24%),
          linear-gradient(180deg, #07101c 0%, #08111f 56%, #0a1220 100%);
      }

      .boot-shell::before {
        content: "";
        position: absolute;
        inset: 0;
        background-image:
          linear-gradient(rgba(148, 163, 184, 0.06) 1px, transparent 1px),
          linear-gradient(90deg, rgba(148, 163, 184, 0.06) 1px, transparent 1px);
        background-size: 88px 88px;
        opacity: 0.34;
      }

      .boot-shell::after {
        content: "";
        position: absolute;
        inset: 0;
        background: radial-gradient(circle at center top, rgba(125, 211, 252, 0.1), transparent 50%);
      }

      .boot-card {
        position: relative;
        z-index: 1;
        display: flex;
        width: min(28rem, calc(100vw - 2rem));
        flex-direction: column;
        align-items: flex-start;
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 2rem;
        padding: 2.35rem 2rem;
        background: linear-gradient(180deg, rgba(10, 18, 31, 0.94), rgba(8, 14, 25, 0.9));
        box-shadow: 0 24px 64px rgba(2, 6, 23, 0.32);
        backdrop-filter: blur(20px);
      }

      .boot-kicker {
        font-size: 0.68rem;
        font-weight: 700;
        letter-spacing: 0.24em;
        text-transform: uppercase;
        color: rgba(226, 232, 240, 0.76);
      }

      .boot-logo {
        width: min(5rem, 24vw);
        height: auto;
        margin-top: 1.1rem;
        filter: drop-shadow(0 18px 40px rgba(15, 23, 42, 0.45));
        animation: boot-breathe 1.8s ease-in-out infinite;
      }

      .boot-caption {
        margin-top: 1.35rem;
        font-size: 1.35rem;
        font-weight: 700;
        letter-spacing: 0.01em;
        line-height: 1.12;
        color: #f8fafc;
      }

      .boot-subtitle {
        max-width: 22rem;
        margin-top: 0.75rem;
        font-size: 0.94rem;
        line-height: 1.65;
        color: rgba(203, 213, 225, 0.78);
      }

      .boot-bar-wrap {
        display: flex;
        width: 100%;
        flex-direction: column;
        gap: 0.65rem;
        align-items: flex-start;
        margin-top: 1.25rem;
      }

      .boot-status {
        font-size: 0.72rem;
        font-weight: 700;
        letter-spacing: 0.22em;
        text-transform: uppercase;
        color: rgba(34, 211, 238, 0.82);
      }

      .boot-bar {
        width: min(14rem, 52vw);
        height: 0.375rem;
        overflow: hidden;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.08);
      }

      .boot-bar::after {
        content: "";
        display: block;
        width: 40%;
        height: 100%;
        border-radius: inherit;
        background: linear-gradient(90deg, #22d3ee 0%, #0ea5e9 100%);
        box-shadow: 0 0 18px rgba(34, 211, 238, 0.35);
        animation: boot-progress 1.2s ease-in-out infinite;
      }

      @keyframes boot-breathe {
        0%,
        100% {
          transform: translateY(0);
          opacity: 0.94;
        }

        50% {
          transform: translateY(-2px);
          opacity: 1;
        }
      }

      @keyframes boot-progress {
        0% {
          transform: translateX(-110%);
        }

        100% {
          transform: translateX(260%);
        }
      }
    </style>
  </head>
  <body>
    <div id="app-boot" data-state="visible" aria-live="polite">
      <div class="boot-shell" aria-hidden="true">
        <div class="boot-card">
          <div class="boot-kicker">Sepetarası</div>
          <img class="boot-logo" src="/brand-loader-logo.svg" alt="" draggable="false" />
          <div class="boot-caption">Giriş ekranı hazırlanıyor</div>
          <div class="boot-subtitle">
            Yetkili oturum katmanı kurulurken ilk ekran tek katmanda tutulur.
          </div>
          <div class="boot-bar-wrap">
            <div class="boot-status">Oturum denetleniyor</div>
            <div class="boot-bar"></div>
          </div>
        </div>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
