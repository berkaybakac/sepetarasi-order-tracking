<!DOCTYPE html>
<html lang="tr" data-app-shell="booting">
  <head>
    <script>
      (function () {
        try {
          var path = window.location && window.location.pathname ? window.location.pathname : "";
          var isDisplayPath =
            path === "/display" || path === "/display/" || path === "/display.html";
          var root = document.documentElement;
          if (!isDisplayPath) return;

          if (window.__displayDiagnosticsInstalled) return;
          window.__displayDiagnosticsInstalled = true;

          function safeToString(value) {
            if (value === null || value === undefined) return String(value);
            if (typeof value === "string") return value;
            if (typeof value === "number" || typeof value === "boolean") return String(value);
            if (value && typeof value.message === "string" && value.message) return value.message;
            try {
              return JSON.stringify(value);
            } catch (_error) {
              return Object.prototype.toString.call(value);
            }
          }

          function sendDiagnostic(phase, payload) {
            try {
              if (typeof Image !== "function") return;

              var query = [];
              var detail =
                payload && payload.detail !== undefined ? payload.detail : payload && payload.message;

              function append(key, value, maxLength) {
                var text;
                if (value === null || value === undefined || value === "") return;
                text = safeToString(value);
                if (text.length > maxLength) {
                  text = text.slice(0, maxLength) + "...";
                }
                query.push(encodeURIComponent(key) + "=" + encodeURIComponent(text));
              }

              append("phase", phase, 80);
              append("detail", detail, 240);
              append("source", payload && payload.source, 240);
              append("location", payload && payload.location, 80);
              append("path", path, 120);
              append(
                "href",
                window.location && window.location.href ? window.location.href : "",
                240,
              );

              var img = new Image();
              img.src = "/display-beacon.gif?" + query.join("&");

              if (!window.__displayDiagnosticImages) {
                window.__displayDiagnosticImages = [];
              }
              window.__displayDiagnosticImages.push(img);
              if (window.__displayDiagnosticImages.length > 8) {
                window.__displayDiagnosticImages.shift();
              }
            } catch (_error) {}
          }

          window.__displaySendDiagnostic = function (phase, detail) {
            sendDiagnostic(phase, { detail: detail });
          };
          sendDiagnostic("inline-script-start");

          function report(kind, payload) {
            sendDiagnostic(kind, payload);
          }

          var previousOnError = window.onerror;
          window.onerror = function (message, source, lineno, colno, error) {
            report("JS ERROR", {
              message: error && error.stack ? error.stack : message,
              source: source,
              location: String(lineno || 0) + ":" + String(colno || 0)
            });
            if (typeof previousOnError === "function") {
              return previousOnError.apply(this, arguments);
            }
            return false;
          };

          var previousOnUnhandledRejection = window.onunhandledrejection;
          window.onunhandledrejection = function (event) {
            var reason = event ? event.reason : undefined;
            report("PROMISE REJECTION", {
              message: reason && reason.stack ? reason.stack : safeToString(reason),
              source: "",
              location: ""
            });
            if (typeof previousOnUnhandledRejection === "function") {
              return previousOnUnhandledRejection.apply(this, arguments);
            }
            return false;
          };

          if (typeof window.addEventListener === "function") {
            window.addEventListener(
              "error",
              function (event) {
                var target = event.target || event.srcElement;
                var tagName;
                var source;

                if (!target || target === window) return;

                tagName = target.tagName ? String(target.tagName).toUpperCase() : "RESOURCE";
                source = target.src || target.href;
                if (!source && typeof target.getAttribute === "function") {
                  source = target.getAttribute("src") || target.getAttribute("href") || "";
                }

                report("RESOURCE LOAD ERROR", {
                  message: tagName + " yuklenemedi",
                  source: source || safeToString(target.outerHTML || tagName),
                  location: ""
                });
              },
              true
            );
          }
        } catch (_error) {}
      })();
    </script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon.png?v=20260416" />
    <link rel="shortcut icon" href="/favicon.png?v=20260416" />
    <title>Sepetarasi</title>
    <style>
      html,
      body {
        margin: 0;
        min-height: 100%;
        background: #08111f;
      }

      body {
        color: #f8fafc;
        font-family:
          Inter,
          ui-sans-serif,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
      }

      #root {
        min-height: 100vh;
        background: transparent;
      }

      html[data-app-shell="ready"] #root {
        opacity: 1;
      }

      html[data-display-shell="instant"] #root {
        opacity: 1;
      }

      #app-boot {
        position: fixed;
        inset: 0;
        z-index: 9999;
        opacity: 1;
        transition: opacity 180ms ease;
      }

      #app-boot[data-state="leaving"] {
        opacity: 0;
        pointer-events: none;
      }

      #app-boot[data-state="hidden"] {
        display: none;
      }

      html[data-display-shell="instant"] #app-boot {
        display: none !important;
      }

      #display-static-probe {
        display: none;
      }

      html[data-display-probe="armed"] #display-static-probe {
        display: block;
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        z-index: 2147483646;
        padding: 18px 16px;
        border-bottom: 4px solid #f59e0b;
        background: #fef3c7;
        color: #111827;
        text-align: center;
        font-family:
          "Segoe UI",
          Arial,
          sans-serif;
      }

      html[data-display-app-mounted="true"] #display-static-probe {
        display: none !important;
      }

      .display-static-probe-title {
        font-size: 32px;
        font-weight: 900;
        letter-spacing: 0.02em;
      }

      .display-static-probe-subtitle {
        margin-top: 8px;
        font-size: 20px;
        font-weight: 700;
      }

      .boot-shell {
        position: relative;
        display: flex;
        min-height: 100dvh;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        background:
          radial-gradient(circle at 14% 14%, rgba(125, 211, 252, 0.08), transparent 30%),
          radial-gradient(circle at 82% 18%, rgba(34, 211, 238, 0.06), transparent 24%),
          linear-gradient(180deg, #07101c 0%, #08111f 56%, #0a1220 100%);
      }

      .boot-shell::before {
        content: "";
        position: absolute;
        inset: 0;
        background-image:
          linear-gradient(rgba(148, 163, 184, 0.06) 1px, transparent 1px),
          linear-gradient(90deg, rgba(148, 163, 184, 0.06) 1px, transparent 1px);
        background-size: 88px 88px;
        opacity: 0.34;
      }

      .boot-shell::after {
        content: "";
        position: absolute;
        inset: 0;
        background: radial-gradient(circle at center top, rgba(125, 211, 252, 0.1), transparent 50%);
      }

      .boot-card {
        position: relative;
        z-index: 1;
        display: flex;
        width: min(30.5rem, calc(100vw - 2rem));
        flex-direction: column;
        align-items: flex-start;
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 2.15rem;
        padding: 2.6rem 2.35rem;
        background: linear-gradient(180deg, rgba(10, 18, 31, 0.94), rgba(8, 14, 25, 0.9));
        box-shadow: 0 28px 72px rgba(2, 6, 23, 0.34);
        backdrop-filter: blur(20px);
      }

      .boot-kicker {
        font-size: 0.78rem;
        font-weight: 700;
        letter-spacing: 0.26em;
        text-transform: uppercase;
        color: rgba(226, 232, 240, 0.76);
      }

      .boot-logo {
        width: min(5.75rem, 27vw);
        height: auto;
        margin-top: 1.2rem;
        filter: drop-shadow(0 18px 40px rgba(15, 23, 42, 0.45));
        animation: boot-breathe 1.8s ease-in-out infinite;
      }

      .boot-caption {
        margin-top: 1.5rem;
        font-size: 1.6rem;
        font-weight: 700;
        letter-spacing: 0.01em;
        line-height: 1.08;
        color: #f8fafc;
      }

      .boot-bar-wrap {
        display: flex;
        width: 100%;
        flex-direction: column;
        gap: 0.72rem;
        align-items: flex-start;
        margin-top: 1.4rem;
      }

      .boot-status {
        font-size: 0.86rem;
        font-weight: 700;
        letter-spacing: 0.08em;
        color: rgba(34, 211, 238, 0.82);
      }

      .boot-bar {
        width: min(15.5rem, 56vw);
        height: 0.4rem;
        overflow: hidden;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.08);
      }

      .boot-bar::after {
        content: "";
        display: block;
        width: 40%;
        height: 100%;
        border-radius: inherit;
        background: linear-gradient(90deg, #22d3ee 0%, #0ea5e9 100%);
        box-shadow: 0 0 18px rgba(34, 211, 238, 0.35);
        animation: boot-progress 1.2s ease-in-out infinite;
      }

      @keyframes boot-breathe {
        0%,
        100% {
          transform: translateY(0);
          opacity: 0.94;
        }

        50% {
          transform: translateY(-2px);
          opacity: 1;
        }
      }

      @keyframes boot-progress {
        0% {
          transform: translateX(-110%);
        }

        100% {
          transform: translateX(260%);
        }
      }
    </style>
  </head>
  <body>
    <div id="app-boot" data-state="visible" aria-live="polite">
      <div class="boot-shell" aria-hidden="true">
        <div class="boot-card">
          <div class="boot-kicker">Sepetarası</div>
          <img class="boot-logo" src="/brand-loader-logo.svg" alt="" draggable="false" />
          <div class="boot-caption">Ekran hazırlanıyor</div>
          <div class="boot-bar-wrap">
            <div class="boot-status">Lütfen bekleyin</div>
            <div class="boot-bar"></div>
          </div>
        </div>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
